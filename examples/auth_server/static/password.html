<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password</title>
  <style>body{background:#fff;color:#111;font:16px sans-serif;margin:2rem} label,button{display:block;margin:.5rem 0}</style>
</head>
<body>
  <h1>Change password</h1>
  <p><a href="/media/static/login.html?next=https%3A%2F%2Flocalhost%3A8443%2Fmedia%2Fstatic%2Fpassword.html">Sign in</a> first. The session cookie is sent with this form.</p>
  <form id="password" method="post" action="/restapi/v1/me/password">
    <label>Current password <input name="current_password" type="password" autocomplete="current-password" required></label>
    <label>New password <input name="new_password" type="password" autocomplete="new-password" required></label>
    <button type="submit">Change password</button>
  </form>
  <p id="msg"></p>
  <script>
    document.getElementById("password").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const resp = await fetch(form.action, {
        method: "POST",
        body: new URLSearchParams(new FormData(form)),
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
      });
      document.getElementById("msg").textContent = resp.status === 204 ? "Password changed." : await resp.text();
    });
  </script>
</body>
</html>
