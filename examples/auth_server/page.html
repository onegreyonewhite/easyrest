<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{.Title}}</title>
  <style>body{background:#fff;color:#111;font:16px sans-serif;margin:2rem} a,button{color:#0645ad}</style>
</head>
<body>
  <h1>Auth server</h1>
  <p><a href="/media/static/login.html?next=https%3A%2F%2Flocalhost%3A8443%2F">Sign in</a></p>
  <p><button id="demo" type="button">Sign in to the demo app</button></p>
  <p><a href="/media/static/password.html">Password</a></p>
  <p><a href="/?format=html">API documentation</a></p>
  <script>
    document.getElementById("demo").addEventListener("click", async () => {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      const verifier = base64url(bytes);
      const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
      const challenge = base64url(digest);
      sessionStorage.setItem("pkce_verifier", verifier);
      const query = new URLSearchParams({
        response_type: "code",
        client_id: "spa",
        redirect_uri: "https://localhost:8443/media/static/callback.html",
        scope: "openid profile email",
        state: crypto.randomUUID(),
        nonce: crypto.randomUUID(),
        code_challenge: challenge,
        code_challenge_method: "S256",
      });
      location.href = "/restapi/v1/authorize/start?" + query.toString();
    });

    function base64url(bytes) {
      let text = "";
      for (const byte of bytes) {
        text += String.fromCharCode(byte);
      }
      return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }
  </script>
</body>
</html>
